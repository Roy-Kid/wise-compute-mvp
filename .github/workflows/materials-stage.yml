name: Build one stage of a materials image

on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      goal:
        description: Stage number, or release
        type: string
        required: true
      previous:
        description: Stage checkpoint to restore
        type: number
        default: 0

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.variant }} ${{ inputs.goal }}
    runs-on: ${{ vars[format('{0}_BUILD_RUNNER', inputs.variant)] || 'ubuntu-24.04' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ inputs.variant }}
      GOAL: ${{ inputs.goal }}
    steps:
      - name: Check build configuration
        run: |
          test "$(uname -m)" = x86_64
          docker info --format '{{.ServerVersion}}'
          docker buildx version
          command -v zstd
          printf 'MATERIALS_CHECKPOINT_DIR=%s/materials-checkpoint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reclaim build space on the standard hosted runner
        if: runner.environment == 'github-hosted' && (vars[format('{0}_BUILD_RUNNER', inputs.variant)] || 'ubuntu-24.04') == 'ubuntu-24.04'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /var/lib/docker

      - name: Download previous checkpoint
        if: inputs.previous != 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checkpoint-${{ inputs.variant }}-${{ inputs.previous }}
          path: ${{ env.MATERIALS_CHECKPOINT_DIR }}/previous

      - name: Restore previous checkpoint
        if: inputs.previous != 0
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          archive="$MATERIALS_CHECKPOINT_DIR/previous/checkpoint-$PREVIOUS.tar.zst"
          zstd -dc "$archive" | docker image load
          rm "$archive"

      - name: Download LAMMPS objects
        if: inputs.variant == 'cuda' && inputs.goal == '3'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: checkpoint-cuda-3.*
          path: ${{ env.MATERIALS_CHECKPOINT_DIR }}/parts
          merge-multiple: true

      - name: Build or verify linux/amd64
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm test
          if [[ "$GOAL" == 1 ]]; then
            npm run test:features -- "$VARIANT" openmp
          fi
          node recipe/delivery/ci-stage.ts "$VARIANT" "$GOAL"

      - name: Pack checkpoint
        if: inputs.goal != 'release'
        run: |
          mkdir -p "$MATERIALS_CHECKPOINT_DIR/out"
          archive="$MATERIALS_CHECKPOINT_DIR/out/checkpoint-$GOAL.tar.zst"
          if [[ "$GOAL" == *.* ]]; then
            tar -C "$MATERIALS_CHECKPOINT_DIR/objects" -cf - . | zstd -T2 -1 -o "$archive"
          else
            docker image save "materials-build:$VARIANT-$GOAL" | zstd -T2 -1 -o "$archive"
          fi

      - name: Save checkpoint to this workflow run
        if: inputs.goal != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checkpoint-${{ inputs.variant }}-${{ inputs.goal }}
          path: ${{ env.MATERIALS_CHECKPOINT_DIR }}/out/checkpoint-${{ inputs.goal }}.tar.zst
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Publish verified image to Docker Hub
        if: inputs.goal == 'release'
        env:
          HUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${HUB_USER:?Set DOCKERHUB_USERNAME to the Docker Hub login}"
          : "${HUB_TOKEN:?Set the DOCKERHUB_TOKEN Actions secret}"
          [[ "$HUB_REPOSITORY" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]] || { echo 'Set DOCKERHUB_REPOSITORY to namespace/repository'; exit 1; }
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$HUB_TOKEN" | docker login --username "$HUB_USER" --password-stdin
          tag=$(jq -er --arg variant "$VARIANT" '[.app, $variant, .version] | join("-")' recipe/delivery/cpu/lavas-release.json)
          node cli/dist/cli.js image push "wise-compute:materials-$VARIANT" "docker.io/$HUB_REPOSITORY:$tag" > release.json
          jq -r '.reference' release.json >> "$GITHUB_STEP_SUMMARY"
