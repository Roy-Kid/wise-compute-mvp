name: Publish materials full CPU and CUDA

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Images to build
        type: choice
        default: both
        options: [both, cpu, cuda]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'cpu' && '["cpu"]' || inputs.variant == 'cuda' && '["cuda"]' || '["cpu","cuda"]') }}
    uses: ./.github/workflows/materials-variant.yml
    with:
      variant: ${{ matrix.variant }}
    secrets: inherit
