name: cli
on:
  push:
    branches: [main]
    paths: [cli/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/cli.yml]
  pull_request:
    paths: [cli/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/cli.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -w cli
      - run: npm pack -w cli --dry-run
