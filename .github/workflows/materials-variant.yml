name: Build one materials image

# A chain of jobs, each within the time limit of a hosted runner (see recipe/delivery/stages.ts).
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true

permissions:
  contents: read

jobs:
  stage1:
    name: base, libraries and Python
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '1'

  stage2:
    name: ELPA
    needs: stage1
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '2'
      previous: 1

  lammps:
    name: LAMMPS part
    needs: stage2
    # Skipped for cpu; the jobs after it must then say that this is no failure.
    if: inputs.variant == 'cuda'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: 3.${{ matrix.part }}
      previous: 2

  stage3:
    name: LAMMPS
    needs: [stage2, lammps]
    if: ${{ !cancelled() && needs.stage2.result == 'success' && (inputs.variant == 'cpu' || needs.lammps.result == 'success') }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '3'
      previous: 2

  stage4:
    name: Quantum ESPRESSO
    needs: stage3
    if: ${{ !cancelled() && needs.stage3.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '4'
      previous: 3

  stage5:
    name: libint and libxc
    needs: stage4
    if: ${{ !cancelled() && needs.stage4.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '5'
      previous: 4

  stage6:
    name: CP2K libraries
    needs: stage5
    if: ${{ !cancelled() && needs.stage5.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '6'
      previous: 5

  stage7:
    name: CP2K
    needs: stage6
    if: ${{ !cancelled() && needs.stage6.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '7'
      previous: 6

  stage8:
    name: Open MPI defaults
    needs: stage7
    if: ${{ !cancelled() && needs.stage7.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '8'
      previous: 7

  release:
    name: verify and publish
    needs: stage8
    if: ${{ !cancelled() && needs.stage8.result == 'success' }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: 'release'
      previous: 8
    secrets: inherit
