name: Build one materials image

# A chain of jobs, each within the time limit of a hosted runner (see recipe/delivery/stages.ts).
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  stage1:
    name: base, libraries and Python
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '1'
    secrets: inherit

  stage2:
    name: ELPA
    needs: stage1
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '2'
    secrets: inherit

  stage3:
    name: LAMMPS
    needs: stage2
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '3'
    secrets: inherit

  stage4:
    name: Quantum ESPRESSO
    needs: stage3
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '4'
    secrets: inherit

  stage5:
    name: libint and libxc
    needs: stage4
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '5'
    secrets: inherit

  stage6:
    name: CP2K libraries
    needs: stage5
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '6'
    secrets: inherit

  stage7:
    name: CP2K
    needs: stage6
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '7'
    secrets: inherit

  release:
    name: verify and publish
    needs: stage7
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: 'release'
    secrets: inherit
