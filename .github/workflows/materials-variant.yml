name: Build one materials image

# A chain of jobs, each within the time limit of a hosted runner (see recipe/delivery/stages.ts).
on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  stage1:
    name: base, libraries and Python
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '1'
    secrets: inherit

  stage2:
    name: ELPA
    needs: stage1
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '2'
    secrets: inherit

  lammps:
    name: LAMMPS part
    needs: stage2
    # Skipped for cpu; the jobs after it must then say that this is no failure.
    if: inputs.variant == 'cuda'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: 3.${{ matrix.part }}
    secrets: inherit

  stage3:
    name: LAMMPS
    needs: [stage2, lammps]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '3'
    secrets: inherit

  stage4:
    name: Quantum ESPRESSO
    needs: stage3
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '4'
    secrets: inherit

  stage5:
    name: libint and libxc
    needs: stage4
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '5'
    secrets: inherit

  stage6:
    name: CP2K libraries
    needs: stage5
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '6'
    secrets: inherit

  stage7:
    name: CP2K
    needs: stage6
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '7'
    secrets: inherit

  stage8:
    name: Open MPI defaults
    needs: stage7
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: '8'
    secrets: inherit

  release:
    name: verify and publish
    needs: stage8
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/materials-stage.yml
    with:
      variant: ${{ inputs.variant }}
      goal: 'release'
    secrets: inherit
