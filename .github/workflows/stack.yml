name: stack
on:
  push:
    branches: [main]
    paths: [stack/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/stack.yml]
  pull_request:
    paths: [stack/**, package.json, package-lock.json, tsconfig.base.json, .github/workflows/stack.yml]
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -w stack

  # Installs every Feature in a real container. Needs Docker.
  features:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:features -w stack

  # Builds the CPU delivery image with wisehub and runs the acceptance script inside it.
  cpu-image:
    needs: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run render -w stack -- cpu
      - run: >-
          node cli/dist/cli.js image build --workspace-folder stack/build/recipes/cpu
          --platform linux/amd64 --image wise-compute:cpu
      - run: >-
          docker run --rm --mount "type=bind,src=$PWD/stack/recipes,dst=/checks,readonly"
          --entrypoint /bin/sh wise-compute:cpu /checks/verify.sh cpu
