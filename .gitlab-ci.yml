# Runner: Docker executor with privileged mode (Docker-in-Docker), linux/amd64.
# CI/CD variables: HARBOR_USER, HARBOR_PASSWORD (masked, protected) and HARBOR_CA (file variable, the Will
# Root CA, so the Dev Container CLI trusts harbor.will).
#
# Merge requests and main build both deliveries from the stack sources (--local-features) and verify them.
# A tag publishes the Features to FEATURE_NAMESPACE, builds the deliveries from those published references,
# verifies them and pushes MATERIALS_REPOSITORY:<tag>-cpu and <tag>-cuda; existing tags are never overwritten.
# Runners have no GPU: the CUDA image is verified without a device run; run
# `stack/delivery/verify.sh cuda` on a GPU node before release.

stages: [test, features, image]

variables:
  HARBOR_REGISTRY: harbor.will
  FEATURE_NAMESPACE: willmat/wise
  MATERIALS_REPOSITORY: harbor.will/willmat/wise-compute-runtime
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  image: docker:28-cli
  before_script:
    - apk add --no-cache nodejs-current npm python3
    - npm ci
    - npm run build

# Docker credentials and CA trust for harbor.will, read by docker and by the Dev Container CLI alike.
.harbor:
  script:
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY"
      "$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')" > ~/.docker/config.json
    - export NODE_EXTRA_CA_CERTS="$HARBOR_CA"

test:
  stage: test
  script:
    - npm test
    - npm pack -w cli --dry-run

features:
  stage: features
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - !reference [.harbor, script]
    - node cli/dist/cli.js feature publish stack --registry "$HARBOR_REGISTRY" --namespace "$FEATURE_NAMESPACE" | tee features.json
  artifacts:
    expire_in: never
    paths: [features.json]

materials:
  stage: image
  services:
    - docker:28-dind
  timeout: 5h
  parallel:
    matrix:
      - VARIANT: [cpu, cuda]
  variables:
    LOCAL_IMAGE: wise-compute:materials-$VARIANT
  rules:
    - if: $CI_COMMIT_TAG
    - changes: [stack/**/*, cli/**/*, package.json, package-lock.json, .gitlab-ci.yml]
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        features=""
        target="$MATERIALS_REPOSITORY:$CI_COMMIT_TAG-$VARIANT"
      else
        features="--local-features stack"
      fi
    # Tag pipelines need the credentials; elsewhere the protected variables are empty and nothing uses them.
    - !reference [.harbor, script]
    - |
      if [ -n "${target:-}" ] && docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
        echo "$target already exists; release tags are immutable" >&2
        exit 1
      fi
    - node cli/dist/cli.js image build --workspace-folder "stack/delivery/$VARIANT" --platform linux/amd64 $features --image "$LOCAL_IMAGE"
    - docker image inspect "$LOCAL_IMAGE" --format '{{.Id}} {{.Size}}' | tee image.txt
    # Unprivileged and offline.
    - >-
      docker run --rm -i --user 65534:65534 --network none --tmpfs /tmp:mode=1777 --shm-size=2g -e WISE_VERIFY_GPU=0
      --entrypoint /bin/sh "$LOCAL_IMAGE" -s "$VARIANT" < stack/delivery/verify.sh
    - |
      if [ -n "${target:-}" ]; then
        node cli/dist/cli.js image push "$LOCAL_IMAGE" "$target" | tee push.json
        node stack/delivery/release-record.mjs "$VARIANT"
      fi
  artifacts:
    when: always
    expire_in: never
    paths: [image.txt, push.json, release.json]
