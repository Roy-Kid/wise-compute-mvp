stages: [test, features, image]

variables:
  HARBOR_REGISTRY: harbor.will
  FEATURE_NAMESPACE: wise/wise-compute-features
  MATERIALS_REPOSITORY: harbor.will/wise/wise-compute-runtime

workflow:
  rules:
    - if: &main_push '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

default:
  image: node:24-alpine
  before_script:
    - npm ci

.harbor:
  script:
    - &configure_harbor |
      : "${HARBOR_USER:?Set HARBOR_USER for the team Harbor project}"
      : "${HARBOR_PASSWORD:?Set HARBOR_PASSWORD for the team Harbor project}"
      : "${HARBOR_CA:?Set HARBOR_CA as a file variable}"
      test -s "$HARBOR_CA"
      export NODE_EXTRA_CA_CERTS="$HARBOR_CA"
      DOCKER_CONFIG=$(mktemp -d)
      export DOCKER_CONFIG
      node --input-type=module <<'JS'
      import { writeFileSync } from "node:fs";
      import { join } from "node:path";
      const { DOCKER_CONFIG, HARBOR_REGISTRY, HARBOR_USER, HARBOR_PASSWORD } = process.env;
      const auth = Buffer.from(HARBOR_USER + ":" + HARBOR_PASSWORD).toString("base64");
      writeFileSync(join(DOCKER_CONFIG, "config.json"),
        JSON.stringify({ auths: { [HARBOR_REGISTRY]: { auth } } }), { mode: 0o600 });
      JS

test:
  stage: test
  script:
    - npm test
    - npm pack -w cli --dry-run

features:
  stage: features
  rules:
    - if: *main_push
  resource_group: publish-features
  script:
    - *configure_harbor
    - node cli/dist/cli.js feature publish recipe --registry "$HARBOR_REGISTRY" --namespace "$FEATURE_NAMESPACE" > features.json
  artifacts:
    expire_in: never
    paths: [features.json]

.image:
  stage: image
  image:
    name: docker:28.5.2-dind
    entrypoint: [""]
  variables:
    DOCKER_HOST: unix:///tmp/wise-docker.sock
  timeout: 5h
  before_script:
    - apk add --no-cache ca-certificates nodejs-current npm
    - npm ci
    - |
      start_docker() {
        dockerd --host "$DOCKER_HOST" > /tmp/wise-dockerd.log 2>&1 &
        daemon_pid=$!
        for _ in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then return 0; fi
          if ! kill -0 "$daemon_pid" 2>/dev/null; then break; fi
          sleep 2
        done
        cat /tmp/wise-dockerd.log >&2
        return 1
      }

materials:verify:
  extends: .image
  parallel: &materials_variants
    matrix:
      - VARIANT: [cpu, cuda]
  rules: &verify_image_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [recipe/**/*, cli/**/*, scripts/**/*, package.json, package-lock.json, .gitlab-ci.yml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - start_docker
    - npm run test:features -- "$VARIANT" openmp
    - node recipe/delivery/ci-image.mjs "$VARIANT"
  artifacts:
    when: always
    paths: [image.txt]

cloud:verify:
  extends: .image
  rules: *verify_image_rules
  timeout: 30m
  script:
    - start_docker
    - npx --no-install wisehub image build --workspace-folder recipe/delivery/cloud --local-features recipe --platform linux/amd64 --image wise-compute:cloud-host
    - npm run test:delivery -- cloud wise-compute:cloud-host

materials:publish:
  extends: .image
  parallel: *materials_variants
  rules:
    - if: *main_push
  resource_group: materials-$CI_COMMIT_SHA-$VARIANT
  script:
    - *configure_harbor
    - install -D -m 0644 "$HARBOR_CA" "/etc/docker/certs.d/$HARBOR_REGISTRY/ca.crt"
    - install -D -m 0644 "$HARBOR_CA" /usr/local/share/ca-certificates/wise-harbor.crt
    - update-ca-certificates
    - start_docker
    - npm run test:features -- "$VARIANT" openmp
    - node recipe/delivery/ci-image.mjs "$VARIANT" --publish
  artifacts:
    when: always
    expire_in: never
    paths: [image.txt, release.json]
